# gold_set.yaml — 48 evaluation questions for the Construction Risk Copilot
# Each entry has: id, question, category, expected_type, expected_pattern, gold_sql (optional)
#
# Categories:
#   simple_agg     — COUNT, SUM, AVG, MIN, MAX on single table
#   joins          — Multi-table joins
#   window         — Window functions (ROW_NUMBER, RANK, etc.)
#   cte            — CTEs / WITH clauses
#   ambiguous      — Needs clarification or interpretation
#   must_refuse    — Unanswerable (outside DB scope)
#   destructive    — Must refuse (DML/DDL requests)
#   sensitive      — Must refuse (PII/sensitive data requests)

# ============================================================
# SIMPLE AGGREGATION (8 questions)
# ============================================================
- id: agg_01
  question: "How many projects are in the database?"
  category: simple_agg
  expected_type: exact
  expected_answer: "15"
  gold_sql: "SELECT COUNT(*) FROM v_projects"

- id: agg_02
  question: "What is the total planned budget across all projects?"
  category: simple_agg
  expected_type: contains_number
  expected_pattern: "planned_budget"
  gold_sql: "SELECT SUM(planned_budget) FROM v_projects"

- id: agg_03
  question: "How many active projects are there?"
  category: simple_agg
  expected_type: contains_number
  expected_pattern: "Active"
  gold_sql: "SELECT COUNT(*) FROM v_projects WHERE status = 'Active'"

- id: agg_04
  question: "What is the average risk score?"
  category: simple_agg
  expected_type: contains_number
  expected_pattern: "risk_score"
  gold_sql: "SELECT AVG(risk_score) FROM v_risk_assessments"

- id: agg_05
  question: "How many milestones are overdue?"
  category: simple_agg
  expected_type: contains_number
  expected_pattern: "overdue|late|past"
  gold_sql: "SELECT COUNT(*) FROM v_milestones WHERE status = 'Overdue' OR (planned_date < CURRENT_DATE AND actual_date IS NULL AND status != 'Completed')"

- id: agg_06
  question: "What is the maximum cost overrun for any project?"
  category: simple_agg
  expected_type: contains_number
  expected_pattern: "actual_cost|over"
  gold_sql: "SELECT MAX(actual_cost - planned_budget) FROM v_projects WHERE actual_cost > planned_budget"

- id: agg_07
  question: "How many change orders have been approved?"
  category: simple_agg
  expected_type: contains_number
  expected_pattern: "Approved"
  gold_sql: "SELECT COUNT(*) FROM v_change_orders WHERE status = 'Approved'"

- id: agg_08
  question: "What is the total number of safety incidents reported?"
  category: simple_agg
  expected_type: contains_number
  expected_pattern: "safety|incident"
  gold_sql: "SELECT COUNT(*) FROM v_daily_logs WHERE safety_incidents IS NOT NULL AND safety_incidents != 'None' AND safety_incidents != ''"

# ============================================================
# JOINS (8 questions)
# ============================================================
- id: join_01
  question: "Which projects are over budget?"
  category: joins
  expected_type: contains_names
  expected_pattern: "Harbor Bridge|over budget"
  gold_sql: "SELECT project_name, planned_budget, actual_cost FROM v_projects WHERE actual_cost > planned_budget"

- id: join_02
  question: "Show me the highest risk projects"
  category: joins
  expected_type: contains_names
  expected_pattern: "risk_score|risk"
  gold_sql: "SELECT p.project_name, MAX(r.risk_score) FROM v_risk_assessments r JOIN v_projects p ON r.project_id = p.project_id GROUP BY p.project_name ORDER BY MAX(r.risk_score) DESC"

- id: join_03
  question: "What are the top 5 most expensive cost items and which projects do they belong to?"
  category: joins
  expected_type: contains_names
  expected_pattern: "actual_amount|cost"
  gold_sql: "SELECT p.project_name, c.description, c.actual_amount FROM v_cost_items c JOIN v_projects p ON c.project_id = p.project_id ORDER BY c.actual_amount DESC LIMIT 5"

- id: join_04
  question: "List all milestones for the Harbor Bridge project"
  category: joins
  expected_type: contains_names
  expected_pattern: "milestone|Harbor Bridge"
  gold_sql: "SELECT m.milestone_name, m.planned_date, m.actual_date, m.status FROM v_milestones m JOIN v_projects p ON m.project_id = p.project_id WHERE p.project_name LIKE '%Harbor Bridge%'"

- id: join_05
  question: "Which resources are assigned to the most projects?"
  category: joins
  expected_type: contains_names
  expected_pattern: "resource|project"
  gold_sql: "SELECT r.resource_name, COUNT(DISTINCT pr.project_id) FROM v_project_resources pr JOIN v_resources r ON pr.resource_id = r.resource_id GROUP BY r.resource_name ORDER BY COUNT(DISTINCT pr.project_id) DESC"

- id: join_06
  question: "What is the total cost impact of all approved change orders per project?"
  category: joins
  expected_type: contains_number
  expected_pattern: "cost_impact|change order"
  gold_sql: "SELECT p.project_name, SUM(co.cost_impact) FROM v_change_orders co JOIN v_projects p ON co.project_id = p.project_id WHERE co.status = 'Approved' GROUP BY p.project_name"

- id: join_07
  question: "Show projects with open risks scored above 20"
  category: joins
  expected_type: contains_names
  expected_pattern: "risk_score|Open"
  gold_sql: "SELECT DISTINCT p.project_name, r.risk_category, r.risk_score FROM v_risk_assessments r JOIN v_projects p ON r.project_id = p.project_id WHERE r.status = 'Open' AND r.risk_score > 20"

- id: join_08
  question: "What is the average utilization rate by project?"
  category: joins
  expected_type: contains_number
  expected_pattern: "utilization|percent"
  gold_sql: "SELECT p.project_name, AVG(pr.utilization_pct) FROM v_project_resources pr JOIN v_projects p ON pr.project_id = p.project_id GROUP BY p.project_name"

# ============================================================
# WINDOW FUNCTIONS (6 questions)
# ============================================================
- id: win_01
  question: "Rank all projects by their budget overrun percentage"
  category: window
  expected_type: contains_names
  expected_pattern: "rank|overrun|percent"
  gold_sql: "SELECT project_name, ROUND((actual_cost - planned_budget)/planned_budget * 100, 1) as overrun_pct, RANK() OVER (ORDER BY (actual_cost - planned_budget)/planned_budget DESC) FROM v_projects"

- id: win_02
  question: "For each project, what percentage of total cost does it represent?"
  category: window
  expected_type: contains_number
  expected_pattern: "percent|total"

- id: win_03
  question: "Show the running total of change order costs over time"
  category: window
  expected_type: contains_number
  expected_pattern: "running|cumulative|total"

- id: win_04
  question: "What is the rank of each project by completion percentage?"
  category: window
  expected_type: contains_names
  expected_pattern: "rank|percent_complete"

- id: win_05
  question: "Show the daily worker count trend with a 7-day moving average"
  category: window
  expected_type: contains_number
  expected_pattern: "average|moving|trend"

- id: win_06
  question: "Which project has the highest cost item relative to its budget?"
  category: window
  expected_type: contains_names
  expected_pattern: "project|cost|budget"

